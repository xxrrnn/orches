[project]
name = "orches"
version = "0.1.0"
description = "Reproducible simulator for the ORCHES GPU-PIM architecture"
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "tomli>=2.2.1; python_version < '3.11'",
]

[project.scripts]
orches = "orches.cli:main"

[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/orches"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: exercises a locally built native backend",
]
