[project]
name = "orches-llava-cot-rtx5070ti"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "accelerate==1.7.0",
    "numpy==1.26.4",
    "pillow==11.2.1",
    "torch==2.7.0",
    "torchvision==0.22.0",
    "transformers==4.45.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
