[project]
name = "orches-llava-cot-server"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "accelerate==0.34.2",
    "numpy==1.26.4",
    "pillow==10.4.0",
    "torch==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.45.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
