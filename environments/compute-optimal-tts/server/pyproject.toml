[project]
name = "orches-compute-optimal-tts-server"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "accelerate==1.2.1",
    "antlr4-python3-runtime==4.11.1",
    "deepspeed==0.15.4",
    "dm-env==1.6",
    "dm-tree==0.1.9",
    "fschat[model_worker,webui]==0.2.36",
    "jsonlines==4.0.0",
    "latex2sympy2",
    "loguru==0.7.3",
    "modelscope==1.21.0",
    "numpy==1.26.4",
    "pylatexenc==2.10",
    "ray[default]==2.38.0",
    "regex==2024.11.6",
    "scipy==1.14.1",
    "setproctitle==1.3.4",
    "setuptools-scm==8.1.0",
    "sympy==1.12",
    "timeout-decorator==0.5.0",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchvision==0.20.1",
    "transformers==4.47.0",
    "typing-extensions==4.12.2",
    "vllm==0.6.4.post1",
    "word2number==1.1",
    "xformers==0.0.28.post3",
]

[tool.uv]
package = false
override-dependencies = ["sympy==1.12"]

[tool.uv.sources]
latex2sympy2 = { path = "../../../third_party/compute-optimal-tts/src/envs/MATH/latex2sympy", editable = true }
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }
torchvision = { index = "pytorch-cu124" }

[tool.uv.extra-build-dependencies]
latex2sympy2 = ["setuptools"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
